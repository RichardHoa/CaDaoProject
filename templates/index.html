{% extends "base.html" %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
{% endblock %}

{% block content %}
<section class="search-section">
    <h1 class="search-header-title">Từ điển & Tìm kiếm Thành Ngữ, Tục Ngữ, Ca Dao Việt Nam</h1>
    
    <div class="search-bar-wrapper">
        <div class="search-container">
            <div class="category-select-wrapper">
                <select id="categorySelect" aria-label="Phân loại">
                    <option value="All">Tất cả phân loại</option>
                    <option value="(CA DAO)">(CA DAO)</option>
                    <option value="(THÀNH NGỮ)">(THÀNH NGỮ)</option>
                    <option value="(TỤC NGỮ)">(TỤC NGỮ)</option>
                    <option value="(THÀNH NGỮ HÁN VIỆT)">(THÀNH NGỮ HÁN VIỆT)</option>
                    <option value="(TỤC NGỮ HÁN VIỆT)">(TỤC NGỮ HÁN VIỆT)</option>
                </select>
            </div>
            <div class="separator-line"></div>
            <input type="text" id="searchInput" placeholder="{{ t.search_placeholder }}" autocomplete="off">
            <button id="searchBtn" aria-label="Tìm kiếm">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
        </div>
    </div>

    <div class="example-questions">
        <span class="example-title" id="suggested-label">{{ t.suggested_searches }}</span>
        <div class="example-list" role="group" aria-labelledby="suggested-label">
            <button type="button" class="example-btn">Tình yêu nam nữ</button>
            <button type="button" class="example-btn">Quan niệm về hôn nhân</button>
            <button type="button" class="example-btn">Châm biếm hài hước</button>
            <button type="button" class="example-btn">Sự hờn dõi ghen tuông</button>
            <button type="button" class="example-btn">Sự cần cù, nhẫn nại</button>
            <button type="button" class="example-btn">Sự hiếu thảo</button>
            <button type="button" class="example-btn">Quan niệm về cái đẹp</button>
            <button type="button" class="example-btn">Phê phán những người lười biếng</button>
            <button type="button" class="example-btn">Sự tích cực trong nghịch cảnh</button>
            <button type="button" class="example-btn">Mối quan hệ giữa người</button>
        </div>
    </div>

    <div class="results" id="results" aria-live="polite">
        <div class="no-results">{{ t.search_initial }}</div>
    </div>

    <!-- Lightbox Modal for enlarged scans -->
    <div id="wikiLightbox" class="wiki-lightbox hidden" role="dialog" aria-modal="true">
        <button class="lightbox-close" id="lightboxClose" aria-label="Close image">×</button>
        <img id="lightboxImg" class="lightbox-content" src="" alt="Enlarged scan">
    </div>
</section>
{% endblock %}

{% block script %}
<script src="{{ url_for('static', filename='js/search.js') }}"></script>
{% endblock %}
