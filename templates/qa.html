{% extends "base.html" %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/qa.css') }}">
{% endblock %}

{% block content %}
<section class="qa-section">
    <h1 class="qa-header-title">Ca dao vấn đáp</h1>
    
    <div class="qa-card-container">
        <h2 class="qa-card-prompt">Hãy chia sẻ băn khoăn hoặc tâm sự của bạn tại đây</h2>
        
        <div class="qa-input-wrapper">
            <textarea 
                id="concernInput" 
                placeholder="Tìm kiếm theo từ khoá..." 
                rows="6"
                aria-required="true"
            ></textarea>
        </div>
        
        <div class="qa-button-wrapper">
            <button id="qaBtn" class="qa-submit-btn" aria-label="Xin lời khuyên">Xin lời khuyên</button>
        </div>
    </div>

    <div id="qaLoading" class="qa-loading hidden">
        <div class="spinner"></div>
        <div class="progress-bar-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>
        <p id="loadingStatus">{{ t.qa_loading }}</p>
    </div>

    <div id="qaResult" class="qa-result hidden" aria-live="polite">
        <h2 class="result-header-title">{{ t.qa_result_title }}</h2>
        
        <div class="result-card">
            <div class="poem-display">
                <span class="label">{{ t.qa_poem_label }}</span>
                <blockquote id="resultPoem"></blockquote>
                <p id="resultSource" class="source-link"></p>
            </div>
            
            <div class="ai-advice">
                <span class="label">{{ t.qa_ai_advice_label }}</span>
                <p id="resultAdvice"></p>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block script %}
<script src="{{ url_for('static', filename='js/qa.js') }}"></script>
{% endblock %}
